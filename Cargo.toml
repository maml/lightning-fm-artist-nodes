[package]
name = "lfm-artist-node"
version = "0.1.0"
description = "Headless LDK Lightning node for Lightning FM managed artists"
authors = ["Matt Loseke"]
edition = "2021"

[dependencies]
ldk-node = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
