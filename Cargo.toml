[package]
name = "lfm-artist-node"
version = "0.1.0"
description = "Headless LDK Lightning node for Lightning FM managed artists"
authors = ["Matt Loseke"]
edition = "2021"

[dependencies]
ldk-node = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
hex = "0.4"
nostr = "0.39"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
